# The entire helicopter stack was removed on 2026-08-15:
#
#   [B42] WarThunderVehicleLibrary  Workshop 3399660368  id WarThunderVehicleLibrary
#   [B42]Aviation Core (Beta)       Workshop 3783444342  id AviationCore
#   [B42] UH-1B Helicopter          Workshop 3409723807  id UH-1BHelicopter
#
# The author repointed the helicopter from WarThunderVehicleLibrary to
# AviationCore on 2026-08-14, and AviationCore also overrides
# media/scripts/heli_sound.txt. The orphaned library kept its own per-tick
# helicopter sound hook, whose target no longer existed, so
# HeliSoundUpdate.lua:69 raised "Object tried to call nil in
# helicopterVisualSoundUpdate" from IsoPlayer.update once per frame per player -
# roughly 200k client Lua errors before it was caught.
#
# Only the library was implicated, but the whole stack went: it is a WIP beta
# (modversion 0.1.5) whose dependencies moved once already and were never
# verified in-world. Re-adding it means re-reading every mod.info require= line
# first, not restoring these three entries from memory.

